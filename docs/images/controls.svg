<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Consolas, 'DejaVu Sans Mono', monospace">
  <rect width="720" height="340" rx="16" fill="#05070a"/>
  <rect x="30" y="30" width="400" height="280" rx="18" fill="#1b1f26" stroke="#3a414c" stroke-width="2"/>
  <!-- DSKY-ish screen -->
  <rect x="55" y="50" width="350" height="200" rx="4" fill="#000" stroke="#2a3a40"/>
  <g fill="#3a3f46">
    <rect x="62" y="58" width="44" height="20"/><rect x="62" y="84" width="44" height="20"/>
    <rect x="110" y="58" width="44" height="20"/><rect x="110" y="84" width="44" height="20" fill="#f9a428"/>
    <rect x="62" y="110" width="44" height="20"/><rect x="110" y="110" width="44" height="20" fill="#f9a428"/>
  </g>
  <rect x="164" y="56" width="180" height="186" fill="#000" stroke="#57ef7b" stroke-width="1"/>
  <g fill="#57ef7b" font-size="22" font-family="'DSEG7 Classic', Consolas, monospace">
    <text x="300" y="86">64</text>
    <text x="176" y="122">06</text><text x="300" y="122">60</text>
    <text x="196" y="160">+02887</text>
    <text x="196" y="196">-00861</text>
    <text x="196" y="232">+00099</text>
  </g>
  <rect x="356" y="62" width="14" height="150" fill="#333"/>
  <rect x="356" y="182" width="14" height="30" fill="#f9a428"/>
  <rect x="352" y="120" width="22" height="3" fill="#f0f"/>
  <!-- button row -->
  <g font-size="11" text-anchor="middle">
    <rect x="58"  y="262" width="62" height="30" rx="5" fill="#d0d0d0"/>
    <rect x="128" y="262" width="62" height="30" rx="5" fill="#e8d000"/>
    <rect x="198" y="262" width="62" height="30" rx="5" fill="#1aa64a"/><text x="229" y="281" fill="#fff">THRUST</text>
    <rect x="268" y="262" width="62" height="30" rx="5" fill="#2a63d6"/>
    <rect x="338" y="262" width="62" height="30" rx="5" fill="#d23a3a"/><text x="369" y="281" fill="#fff">RSET</text>
  </g>
  <path d="M20,120 A210,210 0 0 1 60,40" fill="none" stroke="#57ef7b" stroke-width="3" marker-end="url(#a)"/>
  <path d="M440,120 A210,210 0 0 0 400,40" fill="none" stroke="#57ef7b" stroke-width="3" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#57ef7b"/></marker></defs>
  <g font-size="14" fill="#cfe">
    <text x="460" y="58" fill="#57ef7b" font-size="16">CONTROLS</text>
    <text x="460" y="88">Tilt left/right  steer (pitch)</text>
    <text x="460" y="114"><tspan fill="#4cd27a">GREEN</tspan> hold: throttle up</text>
    <text x="460" y="132" font-size="11" fill="#9aa">      release: DPS minimum 10%</text>
    <text x="460" y="158"><tspan fill="#ff6b6b">RED</tspan>   RSET after a 1202</text>
    <text x="460" y="184">D-pad L/R  pitch trim</text>
    <text x="460" y="204" font-size="12" fill="#9aa">D-pad centre: zero trim</text>
    <text x="460" y="230">PAGE 5 s   About</text>
    <text x="460" y="256">HOME 5 s   exit</text>
    <text x="460" y="282" font-size="12" fill="#9aa">Follow the magenta marks:</text>
    <text x="460" y="298" font-size="12" fill="#9aa">that is the Apollo guidance</text>
  </g>
</svg>
